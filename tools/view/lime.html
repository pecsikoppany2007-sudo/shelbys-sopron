<!doctype html><html><body style="margin:0;background:#333">
<script type="module">
import * as THREE from '../js/three/three.module.min.js';import {GLTFLoader} from '../js/three/GLTFLoader.js';
const r=new THREE.WebGLRenderer({antialias:true});r.setSize(1200,400);document.body.appendChild(r.domElement);r.setClearColor(0x333333);r.setScissorTest(true);
const s=new THREE.Scene();const g=await new GLTFLoader().loadAsync('../models/lime.glb');
const box=new THREE.Box3().setFromObject(g.scene),c=box.getCenter(new THREE.Vector3()),sz=box.getSize(new THREE.Vector3());g.scene.position.sub(c);s.add(g.scene);
let info=[];g.scene.traverse(o=>{if(o.isMesh)info.push(o.material.type+' map:'+!!o.material.map+' uv:'+!!o.geometry.attributes.uv)});document.title=info.join('|')+' size '+sz.toArray().map(v=>v.toFixed(3));
const R=Math.max(sz.x,sz.y,sz.z);[[0,0,1],[0,1,0.001],[1,0,0]].forEach((v,i)=>{const cam=new THREE.PerspectiveCamera(30,1,R/100,R*100);cam.position.set(...v).multiplyScalar(R*2.2);cam.lookAt(0,0,0);r.setViewport(i*400,0,400,400);r.setScissor(i*400,0,400,400);r.render(s,cam)});
window.done=1;
</script></body></html>
